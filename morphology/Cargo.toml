[package]
name = "morphology"
version = "0.1.0"
edition = "2024"

[dependencies]
# Errors and Results
anyhow = "1.0"

# Enums
strum = "0.28.0"
strum_macros = "0.28.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"

# Temporary files
tempfile = "3"

# Package v1
liblzma = { version = "0.4", features = ["parallel", "static"] }
tar = { version = "0.4" }
convert_case = "0.11.0"