[package]
name = "phenotype"
version = "0.2.0"
edition = "2024"

# Build dependencies
[build-dependencies]
anyhow = "1.0"
tonic-prost-build = "0.14.2"

[dependencies]
# Errors and Results
anyhow = "1.0"

# gRPC
prost = "0.14"
tonic = "0.14.2"
tonic-prost = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "io-util"] }