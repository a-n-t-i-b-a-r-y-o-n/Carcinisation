[package]
name = "phenotype"
version = "0.1.0"
edition = "2024"

[dependencies]
# Errors and Results
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "io-util"] }
lazy_static = "1.5"
parking_lot = "0.12"