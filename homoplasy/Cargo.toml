[package]
name = "homoplasy"
version = "0.1.0"
edition = "2024"

[dependencies]
# Results
anyhow = "1.0"

# Enums
strum = "0.28.0"
strum_macros = "0.28.0"

# Serialization
convert_case = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_repr = "0.1"

# HTTP
hyper-util = "0.1"
tonic = "0.14"
tower = "0.5"
tower-service = "0.3"

# Async
lazy_static = "1.5"
parking_lot = "0.13"
tokio = "1.52"

# Proto parsing
bytes = "1.11"
prost-reflect = "0.16"

# Temporary files
tempfile = "3"

# Internal crates
morphology = { path = "../morphology" }
phenotype = { path = "../phenotype" }